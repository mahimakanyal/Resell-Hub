<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #667eea, #764ba2);
}

.card {
    border-radius: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}
</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Resell Hub</span>

    <div>
        <a href="/inbox" class="btn btn-outline-light me-2">📩 Inbox</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</nav>

<div class="container text-center mt-5">

<h2 class="text-white mb-4">Welcome {{ session['user'] }} 👋</h2>

<div class="row justify-content-center">

{% if session['role'] == 'buyer' %}

<div class="col-md-3">
<div class="card p-3">
<a href="/products" class="btn btn-dark">🛒 View Products</a>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<a href="/your_offers" class="btn btn-warning">💰 My Offers</a>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<a href="/purchases" class="btn btn-success">📦 Purchases</a>
</div>
</div>

{% endif %}

{% if session['role'] == 'seller' %}

<div class="col-md-3">
<div class="card p-3">
<a href="/sell" class="btn btn-primary">➕ Sell Product</a>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<a href="/my_products" class="btn btn-dark">📦 My Products</a>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<a href="/seller_offers" class="btn btn-warning">💬 Offers Received</a>
</div>
</div>

{% endif %}

</div>

</div>

</body>
</html>
