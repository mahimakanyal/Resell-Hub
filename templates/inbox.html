<!DOCTYPE html>
<html>
<head>
    <title>Inbox - Resell Hub</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        .navbar {
            background: black;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        .chat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .chat-card:hover {
            transform: scale(1.02);
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty {
            text-align: center;
            color: white;
            margin-top: 50px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>
        <a href="/">🏠 Home</a>
    </div>
    <div>
        <a href="/logout">Logout</a>
    </div>
</div>

<h2>📩 Your Inbox</h2>

<div class="container">

    {% if chats|length == 0 %}
        <div class="empty">
            No messages yet 😔
        </div>
    {% endif %}

    {% for chat in chats %}
    <div class="chat-card">

        <h3>Product ID: {{ chat[0] }}</h3>

        <p>
            <strong>
                {% if session['role'] == 'seller' %}
                    Buyer:
                {% else %}
                    Chat With:
                {% endif %}
            </strong>
            {{ chat[1] }}
        </p>

        <a href="/chat/{{ chat[0] }}/{{ chat[1] }}" class="btn">
            💬 Open Chat
        </a>

    </div>
    {% endfor %}

</div>

</body>
</html>
