<!DOCTYPE html>
<html>
<head>
<title>Chat</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.chat-box {
    height: 400px;
    overflow-y: scroll;
    border: 1px solid #ccc;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 10px;
}

.my-msg {
    text-align: right;
    margin: 8px;
}

.other-msg {
    text-align: left;
    margin: 8px;
}

.msg-bubble {
    display: inline-block;
    padding: 10px 15px;
    border-radius: 15px;
    max-width: 70%;
}

.my-msg .msg-bubble {
    background: #0d6efd;
    color: white;
}

.other-msg .msg-bubble {
    background: #e9ecef;
    color: black;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">🏠 Home</a>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>
</nav>

<div class="container mt-4">

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Chat with {{ other }}</h3>
    <a href="/" class="btn btn-secondary">⬅ Back to Home</a>
</div>

<!-- CHAT BOX -->
<div class="chat-box mb-3">

{% for msg in messages %}
<div class="{% if msg[1] == session['user'] %}my-msg{% else %}other-msg{% endif %}">
    
    <div class="msg-bubble">
        <strong>{{ msg[1] }}</strong><br>
        {{ msg[4] }} <br>
        <small>{{ msg[5] }}</small>
    </div>

</div>
{% endfor %}

</div>

<!-- MESSAGE FORM -->
<form method="POST" action="/chat/{{ pid }}/{{ other }}">

<input type="hidden" name="receiver" value="{{ other }}">
<input type="hidden" name="product_id" value="{{ pid }}">

<div class="input-group">
    <input type="text" name="message" class="form-control" placeholder="Type message..." required>
    <button class="btn btn-primary">Send</button>
</div>

</form>

</div>

</body>
</html>
