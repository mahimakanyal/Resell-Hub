<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #ff9966, #ff5e62);
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/">🏠 Home</a>
<a href="/my_products" class="btn btn-warning">Back</a>
<a href="/logout" class="btn btn-danger">Logout</a>
</div>
</nav>

<div class="container mt-5">

<div class="card p-4 shadow">

<h3 class="text-center mb-4">✏️ Edit Product</h3>

<form method="POST">

<!-- PRODUCT NAME -->
<div class="mb-3">
<label>Product Name</label>
<input type="text" name="name" value="{{ p[1] }}" class="form-control" required>
</div>

<!-- PRICE -->
<div class="mb-3">
<label>Price</label>
<input type="number" name="price" value="{{ p[2] }}" class="form-control" required>
</div>

<!-- DESCRIPTION -->
<div class="mb-3">
<label>Description</label>
<textarea name="description" class="form-control" required>{{ p[3] }}</textarea>
</div>

<!-- CATEGORY -->
<div class="mb-3">
<label>Category</label>
<select name="category" class="form-control" required>
    <option value="electronics" {% if p[6]=='electronics' %}selected{% endif %}>Electronics</option>
    <option value="fashion" {% if p[6]=='fashion' %}selected{% endif %}>Fashion</option>
    <option value="books" {% if p[6]=='books' %}selected{% endif %}>Books</option>
    <option value="furniture" {% if p[6]=='furniture' %}selected{% endif %}>Furniture</option>
</select>
</div>

<!-- LOCATION -->
<div class="mb-3">
<label>Location</label>
<input type="text" name="location" 
       value="{{ p[9] }}" 
       class="form-control" required>
</div>

<!-- CONTACT -->
<div class="mb-3">
<label>Contact</label>
<input type="text" name="contact" value="{{ p[7] }}" class="form-control" required>
</div>

<div class="mb-3">
<label>Status</label>
<select name="status" class="form-control" required>
    <option value="available" {% if p[8]=='available' %}selected{% endif %}>Available</option>
    <option value="sold" {% if p[8]=='sold' %}selected{% endif %}>Sold</option>
</select>
</div>

<button class="btn btn-success w-100">Update Product</button>

</form>

</div>

</div>

</body>
</html>
