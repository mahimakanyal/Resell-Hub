<!DOCTYPE html>
<html>
<head>
<title>Login - Resell Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
background: url('https://images.unsplash.com/photo-1607082349566-187342175e2f');
background-size: cover;
background-position: center;
}

.card {
background: rgba(255,255,255,0.9);
border-radius: 15px;
}
</style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card p-4 shadow" style="width:350px;">

<h3 class="text-center mb-3">Login</h3>

<form method="POST">

<input type="text" name="username" placeholder="Username" class="form-control mb-3" required>

<input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

<select name="role" class="form-control mb-3" required>
<option value="">Login as</option>
<option value="buyer">Buyer</option>
<option value="seller">Seller</option>
</select>

<button class="btn btn-primary w-100">Login</button>

</form>

<!-- 🔥 REGISTER OPTION -->
<div class="text-center mt-3">
<p class="mb-1">First time user?</p>
<a href="/register" class="btn btn-outline-success w-100">Register Here</a>
</div>

</div>

</div>

</body>
</html>
